<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./css/style.css">

    <title>Newsletter sign-up form</title>
</head>
<body>

    <main class="main-container">


        <div class="image-container">
                      
            <picture>
  <!-- Desktop: 1024px and up -->
  <source media="(min-width: 1440x)" srcset="./images/illustration-sign-up-desktop.svg">
  
  <!-- Tablet: 768px to 1023px -->
  <source media="(min-width: 768px)" srcset="./images/illustration-sign-up-tablet.svg">
  
  <!-- Mobile (Default fallback): under 768px -->
  <img src="./images/illustration-sign-up-mobile.svg" alt="Description of the item" class="responsive-img">
</picture>

        </div>
     
        <div class="form-container">
            <span class="title">Stay updated!</span>
<!-- 24 -->
            <p class="description">Join 60,000+ product managers receiving monthly updates on:</p>
<!-- 24 -->
            <ul class="list">
                <li class="list-item">Product discovery and building what matters</li>
                <li class="list-item">Measuring to ensure updates are a success</li>
                <li class="list-item">And much more!</li>
            </ul>
<!-- 40 -->

            <form class="form" id="signup-form" novalidate>


                <!--?  maybe change to form group -->
             <div class="field-group">

                 <label class="form-label" for="sign-in-email">
                    <span class="form-label-title">Email address</span>
                    <span 
                        class="error-message"
                        id="email-error"
                        role="alert"
                        hidden
                        >
                            Valid email required
                    </span>
                </label>
                 
                 <!-- 8 -->
                 <!-- type email help mobile devices open keyboard -->
                 <!-- name  defies key name sent to server/form handler  -->
                 <!-- label for and input id must match -->
                 
                 <input 
                 class="form-input"
                 type="email"  
                 id="sign-in-email"
                 name="email"
                 autocomplete="email"
                 placeholder="email@company.com"
                 aria-invalid="true"
                 aria-required="true"
                 aria-describedby="email-error"
                 required 
                 />
                 <!-- 24 -->
                </div>

                  <!-- <p id="email-error" class="error-message" role="alert" hidden>
      <span aria-hidden="true">⚠</span> 
      Please enter a valid email address, such as name@example.com.
    </p> -->

                <button class="form-button" type="submit">
                    Subscribe to monthly newsletter
                    <!-- <span class="form-btn-label">Subscribe to monthly newsletter</span>     -->
                </button>

            </form>
        </div>
  

    </main>

     
</body>
</html>
